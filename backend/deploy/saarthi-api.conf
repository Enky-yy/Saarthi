# Saarthi backend behind nginx + free Certbot HTTPS.
# sudo cp backend/deploy/saarthi-api.conf /etc/nginx/sites-available/
# sudo ln -s /etc/nginx/sites-available/saarthi-api.conf /etc/nginx/sites-enabled/
# sudo certbot --nginx -d api.yourdomain.in   # then: sudo systemctl reload nginx
server {
    listen 80;
    server_name api.yourdomain.in;

    client_max_body_size 30m;  # voice notes + screenshots

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;  # first model load can be slow on CPU
    }
}
